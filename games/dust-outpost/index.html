<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b12">
<title>DUST OUTPOST</title>
<style>
  html, body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    background: #0d0b12;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9997;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0d0b12;
    color: #b9aed6;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  #rotate .phone {
    width: 44px;
    height: 72px;
    border: 3px solid #8a7bb8;
    border-radius: 10px;
    animation: tilt 1.8s ease-in-out infinite;
  }
  #rotate strong {
    display: block;
    font-size: 17px;
    color: #ffd166;
    letter-spacing: 0.08em;
  }
  @keyframes tilt {
    0%, 40% { transform: rotate(0deg); }
    70%, 100% { transform: rotate(-90deg); }
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">
  <div class="phone"></div>
  <div><strong>请横屏游玩</strong>Dust Outpost 需要横向屏幕</div>
</div>
<script>
  const report = (message) => {
    let box = document.getElementById('err');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'err';
      box.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;margin:0;padding:8px;background:#000d;color:#ff7a7a;font:12px/1.4 monospace;white-space:pre-wrap;max-width:100%';
      document.body.appendChild(box);
    }
    box.textContent += message + '\n';
  };
  window.addEventListener('error', (e) => report(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', (e) => report('PROMISE: ' + (e.reason && e.reason.message || e.reason)));
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>

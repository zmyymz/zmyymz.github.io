<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>五骰押注</title>
<style>
  :root{
    --felt-2:#0c2a22;
    --cream:#f4ead6;
    --gold:#d8a13a;
    --ink:#1b1710;
    --green:#4fae78;
    --red:#d4614f;
    --panel:rgba(0,0,0,.26);
    --line:rgba(244,234,214,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1b5342 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, #0a241d 0%, transparent 55%),
      var(--felt-2);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;min-height:100%;overflow:hidden;
  }
  #app{width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;}

  header{display:flex;align-items:center;gap:9px;padding:9px 13px 7px;
    border-bottom:1px solid var(--line);flex:0 0 auto;}
  .lv{font-size:11.5px;letter-spacing:.1em;color:#9dc4b4;white-space:nowrap;}
  .lv b{color:var(--cream);font-size:15px;}
  .pips{display:flex;gap:3px;flex:1;margin-left:2px;}
  .pips i{width:100%;height:3px;border-radius:2px;background:rgba(244,234,214,.16);}
  .pips i.done{background:var(--gold);}
  .pips i.now{background:#ffd97a;box-shadow:0 0 6px rgba(255,217,122,.7);}
  .bank{text-align:right;line-height:1.1;white-space:nowrap;}
  .bank small{display:block;font-size:9.5px;color:#9dc4b4;letter-spacing:.1em;}
  .bank .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);}
  .bank .v.flash{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16);color:#fff}100%{transform:scale(1)}}
  .help{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
    background:rgba(244,234,214,.07);color:#9dc4b4;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .cardzone{flex:0 0 auto;padding:8px 13px 0;}
  .tcard{position:relative;display:flex;gap:9px;align-items:center;
    background:linear-gradient(180deg,#f7efdd,#e8d9ba);
    color:var(--ink);border-radius:11px;padding:8px 10px;
    box-shadow:0 3px 0 rgba(0,0,0,.33),inset 0 0 0 2px rgba(255,255,255,.5);}
  .tcard .ico{width:38px;height:52px;flex:0 0 auto;border-radius:5px;overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.3);}
  .tcard .ico img{width:100%;height:100%;object-fit:cover;display:block;}
  .tcard .body{min-width:0;flex:1;}
  .tcard .nm{font-size:13.5px;font-weight:800;letter-spacing:.03em;}
  .tcard .ds{font-size:11px;line-height:1.32;color:#4a4030;margin-top:1px;}
  .tcard .tag{position:absolute;top:-6px;right:7px;font-size:9px;letter-spacing:.08em;
    background:var(--gold);color:#231a06;padding:2px 5px;border-radius:4px;font-weight:800;}

  .dicezone{flex:1 1 auto;min-height:96px;padding:8px 13px 2px;
    display:flex;flex-direction:column;justify-content:center;}
  .dice{display:flex;justify-content:center;gap:clamp(5px,1.8vw,10px);min-height:76px;align-items:center;}
  .die{width:clamp(46px,16vw,64px);height:clamp(46px,16vw,64px);border-radius:10px;position:relative;
    transition:transform .12s ease;cursor:pointer;flex:0 0 auto;}
  .die img{width:100%;height:100%;display:block;border-radius:9px;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));}
  .die.locked{transform:translateY(-5px);}
  .die.locked::after{content:"";position:absolute;inset:-4px;border-radius:12px;
    border:2.5px solid #ff6b5a;box-shadow:0 0 11px rgba(255,107,90,.5);}
  .die.empty{background:rgba(255,255,255,.045);border:1.5px dashed rgba(244,234,214,.18);}
  .hint{text-align:center;font-size:10.5px;color:#8fb5a5;height:14px;
    letter-spacing:.02em;overflow:hidden;white-space:nowrap;}

  .ctl{flex:0 0 auto;display:flex;gap:7px;padding:6px 13px 8px;}
  button{font-family:inherit;border:0;border-radius:9px;font-weight:800;letter-spacing:.03em;
    cursor:pointer;transition:transform .07s;padding:11px 8px;font-size:14.5px;}
  button:active:not(:disabled){transform:translateY(2px);}
  button:disabled{opacity:.32;cursor:default;}
  .btn-main{flex:1;background:linear-gradient(180deg,#e6b04a,#c9922b);color:#2a1e05;
    box-shadow:0 3px 0 #8f6a1c;}
  .btn-main.green{background:linear-gradient(180deg,#6ad096,#46a56e);color:#04220f;
    box-shadow:0 3px 0 #2d6f4a;}
  .btn-side{flex:0 0 auto;padding:8px 12px;line-height:1.15;}
  .btn-side .pay{display:block;font-size:10.5px;font-weight:800;letter-spacing:0;opacity:.88;}
  .btn-fold{background:rgba(244,234,214,.1);color:var(--cream);
    border:1px solid rgba(244,234,214,.22);box-shadow:0 3px 0 rgba(0,0,0,.3);}

  .betzone{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 13px calc(10px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
  .betzone::-webkit-scrollbar{width:0;}
  .bhead{display:flex;align-items:center;gap:7px;margin:1px 0 6px;
    font-size:10.5px;color:#9dc4b4;letter-spacing:.06em;}
  .bhead .chipsel{display:flex;gap:4px;margin-left:auto;}
  .chipsel button{padding:4px 7px;font-size:10.5px;border-radius:6px;
    background:rgba(244,234,214,.07);color:#cfe3d9;box-shadow:none;
    border:1px solid rgba(244,234,214,.15);font-weight:700;}
  .chipsel button.on{background:var(--gold);color:#2a1e05;border-color:var(--gold);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;
    flex:1 1 auto;align-content:stretch;grid-auto-rows:minmax(58px,1fr);}
  .slot{position:relative;background:var(--panel);border-radius:9px;padding:6px 8px;
    border:1px solid var(--line);transition:border-color .14s,background .14s;cursor:pointer;
    overflow:hidden;min-height:58px;}
  .slot.on{border-color:var(--gold);background:rgba(216,161,58,.16);}
  .slot.win{border-color:var(--green);background:rgba(79,174,120,.22);}
  .slot.lose{opacity:.38;}
  .slot.banned{opacity:.25;cursor:not-allowed;}
  .slot.formed{border-color:#6ad096;box-shadow:0 0 0 1px rgba(106,208,150,.35) inset;}
  .slot .nm{font-size:12px;font-weight:700;padding-right:36px;}
  .slot .odds{position:absolute;top:5px;right:7px;font-size:11.5px;font-weight:800;
    color:var(--gold);font-variant-numeric:tabular-nums;}
  .slot .meta{font-size:9.5px;color:#8fb5a5;margin-top:1px;font-variant-numeric:tabular-nums;}
  .slot .stake{font-size:10.5px;font-weight:800;color:#ffd97a;margin-top:1px;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot .stake.dim{color:#6f9686;font-weight:600;}
  .slot .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);
    opacity:.45;transition:width .25s;}

  .toast{position:absolute;left:50%;top:16.5%;transform:translate(-50%,-50%) scale(.92);
    background:rgba(8,26,21,.95);border:1px solid var(--gold);color:var(--cream);
    padding:12px 18px;border-radius:13px;text-align:center;pointer-events:none;opacity:0;
    transition:opacity .2s,transform .2s;z-index:40;min-width:140px;max-width:84%;}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .toast .big{font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
  .toast .big.neg{color:var(--red);}
  .toast .sm{font-size:10.5px;color:#9dc4b4;margin-top:3px;letter-spacing:.02em;line-height:1.45;}

  .overlay{position:absolute;inset:0;background:rgba(6,20,16,.95);z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px 20px;gap:9px;text-align:center;opacity:0;pointer-events:none;transition:opacity .28s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{margin:0;font-size:19px;letter-spacing:.1em;}
  .overlay .tier{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:.1em;}
  .overlay p{margin:0;font-size:12px;color:#9dc4b4;line-height:1.85;}
  .overlay .num{font-size:15px;color:var(--cream);font-variant-numeric:tabular-nums;}
  /* 关键：overlay 是竖向 flex，必须取消 .btn-main 的 flex:1，否则按钮会被拉满高度 */
  .overlay .btn-main{flex:0 0 auto;width:auto;min-width:150px;padding:11px 30px;
    font-size:14px;margin-top:10px;border-radius:10px;}
  .overlay .btn-main:only-of-type{min-width:170px;}
  .rules{text-align:left;font-size:11.5px;line-height:1.6;color:#b6d2c5;width:100%;
    max-width:334px;max-height:64vh;overflow-y:auto;padding-right:4px;}
  @media (max-height:700px){
    .rules{font-size:11px;line-height:1.52;max-height:66vh;}
    .rules h3{margin:7px 0 2px;}
    .overlay h2{font-size:17px;}
    .overlay .tier{font-size:26px;}
  }
  .rules h3{margin:9px 0 3px;font-size:11.5px;color:var(--gold);letter-spacing:.06em;}
  .rules h3:first-child{margin-top:0;}
  .rules b{color:var(--cream);}
  .rules ul{margin:0;padding-left:15px;}
  .rules li{margin-bottom:3px;}
  .rules table{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:3px;}
  .rules th,.rules td{padding:2px 4px;text-align:right;border-bottom:1px solid rgba(244,234,214,.08);}
  .rules::-webkit-scrollbar{width:0;}
  .rules th:first-child,.rules td:first-child{text-align:left;}

  /* ============ 平板 / 大屏手机 ============ */
  @media (min-width:560px){
    #app{max-width:660px;}
    header{padding:10px 18px 8px;gap:11px;}
    .lv{font-size:12.5px;} .lv b{font-size:16px;}
    .bank .v{font-size:21px;}
    .cardzone{padding:10px 18px 0;}
    .tcard{padding:10px 13px;border-radius:13px;gap:11px;}
    .tcard .ico{width:44px;height:58px;}
    .tcard .nm{font-size:15px;}
    .tcard .ds{font-size:12px;line-height:1.4;}
    .dicezone{padding:12px 18px 4px;}
    .dice{gap:12px;}
    .die{width:72px;height:72px;}
    .hint{font-size:11.5px;height:16px;}
    .ctl{padding:8px 18px 10px;gap:8px;}
    button{font-size:15.5px;padding:12px 10px;}
    .betzone{padding:0 18px calc(12px + env(safe-area-inset-bottom));}
    .bhead{font-size:11.5px;}
    .grid{gap:8px;grid-auto-rows:minmax(64px,1fr);}
    .slot{padding:8px 10px;min-height:64px;}
    .slot .nm{font-size:13px;}
    .slot .odds{font-size:12px;}
    .slot .meta{font-size:10.5px;}
    .slot .stake{font-size:11.5px;}
  }

  /* ============ PC 双列布局 ============ */
  @media (min-width:900px){
    body{align-items:stretch;}
    #app{max-width:1180px;display:grid;
      grid-template-columns:minmax(0,1fr) minmax(380px,430px);
      grid-template-rows:auto auto 1fr auto;
      grid-template-areas:
        "hdr  hdr"
        "dice card"
        "dice bet"
        "ctl  bet";
      overflow:hidden;
    }
    header{grid-area:hdr;padding:14px 26px 12px;gap:14px;}
    .lv{font-size:13px;} .lv b{font-size:18px;}
    .pips{max-width:420px;margin-right:auto;gap:5px;}
    .pips i{height:4px;}
    .bank small{font-size:10.5px;}
    .bank .v{font-size:24px;}
    .help{width:30px;height:30px;font-size:15px;}

    .cardzone{grid-area:card;padding:18px 22px 0;align-self:start;}
    .tcard{padding:12px 14px;border-radius:14px;gap:12px;}
    .tcard .ico{width:52px;height:72px;border-radius:6px;}
    .tcard .nm{font-size:16px;}
    .tcard .ds{font-size:12.5px;line-height:1.42;}
    .tcard .tag{top:-8px;right:10px;font-size:10px;padding:3px 7px;}

    .dicezone{grid-area:dice;padding:18px 26px 6px;min-height:0;justify-content:center;position:relative;}
    .dicezone::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(96%,700px);height:min(72%,560px);border-radius:50%/44%;
      background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.055),rgba(255,255,255,0) 64%);
      border:1px solid rgba(244,234,214,.07);
      box-shadow:inset 0 0 0 1px rgba(216,161,58,.07),inset 0 0 70px rgba(0,0,0,.28);
      pointer-events:none;}
    .dice,.hint{position:relative;z-index:1;}
    .dice{gap:clamp(12px,1.6vw,22px);min-height:0;}
    .die{width:clamp(62px,7.4vw,116px);height:clamp(62px,7.4vw,116px);border-radius:16px;}
    .die img{border-radius:14px;}
    .hint{font-size:12.5px;height:20px;margin-top:14px;}

    .ctl{grid-area:ctl;padding:6px 26px 22px;width:100%;max-width:620px;margin:0 auto;}
    .ctl button{border-radius:11px;font-size:16px;padding:14px 12px;}
    .ctl .btn-side{padding:10px 18px;}

    .betzone{grid-area:bet;padding:18px 22px 22px;min-height:0;}
    .bhead{font-size:11.5px;margin:0 0 9px;}
    .bhead .chipsel button{padding:5px 9px;font-size:11.5px;border-radius:7px;}
    .grid{grid-template-columns:1fr 1fr;gap:8px;grid-auto-rows:minmax(66px,1fr);}
    .slot{display:flex;flex-direction:column;justify-content:center;
      padding:0 12px;min-height:66px;border-radius:11px;}
    .slot .nm{font-size:13.5px;padding-right:46px;}
    .slot .odds{top:8px;right:11px;font-size:12.5px;}
    .slot .meta{font-size:10.5px;margin-top:2px;}
    .slot .stake{font-size:11.5px;}

    .toast{top:20%;min-width:180px;padding:14px 22px;}
    .toast .big{font-size:28px;}
    .toast .sm{font-size:11.5px;}

    .overlay{padding:26px 30px;}
    .overlay h2{font-size:22px;}
    .overlay .tier{font-size:38px;}
    .overlay p{font-size:13px;line-height:1.9;}
    .overlay .btn-main{padding:13px 38px;font-size:15.5px;}
    .rules{max-width:560px;max-height:68vh;font-size:13px;line-height:1.7;}
    .rules h3{font-size:13px;margin:12px 0 4px;}
    .rules table{font-size:11.5px;}
    .rules th,.rules td{padding:3px 6px;}
  }

  /* 笔记本 / 矮屏 PC：压缩纵向空间 */
  @media (min-width:900px) and (max-height:780px){
    header{padding:9px 22px 7px;}
    .cardzone{padding:9px 20px 0;}
    .tcard{padding:9px 12px;gap:10px;}
    .tcard .ico{width:40px;height:54px;}
    .dicezone{padding:6px 22px 2px;}
    .die{width:clamp(64px,6.8vw,86px);height:clamp(64px,6.8vw,86px);}
    .hint{margin-top:6px;}
    .ctl{padding:4px 22px 12px;max-width:560px;}
    .ctl button{padding:11px 10px;font-size:15px;}
    .betzone{padding:10px 20px 14px;}
    .grid{grid-auto-rows:minmax(54px,1fr);}
    .slot{min-height:54px;}
    .overlay .tier{font-size:30px;}
    .rules{font-size:12.5px;}
    .rules h3{margin:7px 0 2px;}
  }

  /* 手机横屏 / 超矮屏：保留单列但紧凑显示 */
  @media (max-width:899px) and (max-height:640px){
    header{padding:5px 13px 4px;}
    .lv b{font-size:13px;}
    .cardzone{padding:5px 13px 0;}
    .tcard{padding:5px 8px;border-radius:9px;gap:7px;}
    .tcard .ico{width:30px;height:40px;}
    .tcard .nm{font-size:12px;}
    .tcard .ds{font-size:9.5px;line-height:1.25;}
    .dicezone{padding:3px 13px 0;flex:0 0 auto;min-height:0;}
    .dice{min-height:46px;gap:6px;}
    .die{width:46px;height:46px;border-radius:8px;}
    .hint{font-size:9.5px;height:12px;margin-top:2px;}
    .ctl{padding:3px 13px 5px;gap:6px;}
    .ctl button{padding:8px 8px;font-size:13px;}
    .betzone{padding:0 13px calc(5px + env(safe-area-inset-bottom));}
    .bhead{margin-bottom:4px;font-size:9.5px;}
    .chipsel button{padding:3px 6px;font-size:9.5px;}
    .grid{grid-auto-rows:minmax(46px,1fr);gap:5px;}
    .slot{min-height:46px;padding:4px 7px;border-radius:7px;}
    .slot .nm{font-size:11px;padding-right:33px;}
    .slot .odds{font-size:10px;top:4px;right:6px;}
    .slot .meta{font-size:9px;}
    .slot .stake{font-size:9.5px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="lv">第 <b id="lv">1</b> 关</div>
    <div class="pips" id="pips"></div>
    <div class="bank"><small>筹码</small><div class="v" id="bank">1000</div></div>
    <div class="help" id="helpBtn">?</div>
  </header>

  <div class="cardzone">
    <div class="tcard">
      <div class="tag" id="cardTag">任务</div>
      <div class="ico"><img id="cardImg" alt=""></div>
      <div class="body">
        <div class="nm" id="cardName">—</div>
        <div class="ds" id="cardDesc">—</div>
      </div>
    </div>
  </div>

  <div class="dicezone">
    <div class="dice" id="dice"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="ctl">
    <button class="btn-main" id="btnMain">掷 骰</button>
    <button class="btn-side btn-fold" id="btnFold" style="display:none">弃注<span class="pay" id="foldHint"></span></button>
  </div>

  <div class="betzone">
    <div class="bhead">
      <span>选一个注位下注</span>
      <span id="betTotal" style="color:#ffd97a;font-weight:700;"></span>
      <span class="chipsel" id="chipsel"></span>
    </div>
    <div class="grid" id="slots"></div>
  </div>

  <div class="toast" id="toast"><div class="big" id="toastBig"></div><div class="sm" id="toastSm"></div></div>

  <div class="overlay" id="ov">
    <h2>十 关 结 算</h2>
    <div class="tier" id="ovTier">—</div>
    <p id="ovBody">—</p>
    <button class="btn-main" id="ovBtn">再来一局</button>
  </div>

  <div class="overlay" id="ovRules">
    <h2>玩 法</h2>
    <div class="rules">
      <p style="margin:0 0 8px">起始 <b>1000</b> 筹码，打 <b>10 关</b>。每关翻 1 张任务牌，改赔率或改规则。</p>
      <h3>每关三步</h3>
      <ul>
        <li><b>选注位</b>：10 选 1，决定你要掷出什么牌型</li>
        <li><b>投掷</b>：3 次，点骰子锁定，只重掷没锁的</li>
        <li><b>结算</b>：成型后按赔率领取；未成型可弃注退 <b>25%</b></li>
      </ul>
      <h3>赔率表（3 次投掷）</h3>
      <table id="oddsTable"></table>
      <p style="margin:8px 0 0;color:#8fb5a5;font-size:10.5px;line-height:1.5">
      段位：铜 ≥1050 ｜ 银 ≥1400 ｜ 金 ≥1700 ｜ 传奇 ≥2200<br>
      注位上的「命中 %」按最优锁骰算出，照着选就行。</p>
    </div>
    <button class="btn-main" id="ovRulesBtn">开始</button>

<script>
(function(){
"use strict";

/* ================= 概率与赔率（穷举动态规划，见 build/gen_tables.py） ================= */
var SLOTS = ['ss','tp','fh','fo','ls','yz','s27','s12','ad','pa'];
var INFO = {
  ss: {name:'小顺',     sub:'含 1234/2345/3456'},
  tp: {name:'两对',     sub:'两对且不含 1'},
  fh: {name:'葫芦',     sub:'3 + 2'},
  fo: {name:'四条',     sub:'≥4 张同点'},
  ls: {name:'大顺',     sub:'12345 或 23456'},
  yz: {name:'快艇',     sub:'五张全同'},
  s27:{name:'和值≥27',  sub:'五骰总和'},
  s12:{name:'和值≤12',  sub:'五骰总和'},
  ad: {name:'全不同',   sub:'五个面各一颗'},
  pa: {name:'全奇偶',   sub:'奇偶一致'}
};
/* 3 次投掷（默认） */
var O3 = {ss:1.55,tp:1.65,fh:2.65,fo:3.30,ls:3.70,yz:21.00,s27:5.10,s12:1.45,ad:1.85,pa:1.50};
var P3 = {ss:.6154,tp:.5851,fh:.3629,fo:.2908,ls:.2611,yz:.0460,s27:.1869,s12:.6631,ad:.5251,pa:.6484};
/* 2 次投掷（寒风牌） */
var O2 = {ss:2.35,tp:2.55,fh:5.00,fo:7.25,ls:7.50,yz:76.00,s27:14.50,s12:2.45,ad:3.00,pa:2.55};
var P2 = {ss:.4118,tp:.3734,fh:.1912,fo:.1323,ls:.1297,yz:.0126,s27:.0652,s12:.3901,ad:.3177,pa:.3750};

/* ================= 任务牌 ================= */
var CARDS = [
  {nm:'顺风',  ds:'小顺、大顺 赔率 +1.5',           mod:{add:{ss:1.5, ls:1.5}}},
  {nm:'双生',  ds:'葫芦 赔率 ×2',                   mod:{mul:{fh:2}}},
  {nm:'铁壁',  ds:'四条 赔率 ×2',                   mod:{mul:{fo:2}}},
  {nm:'五连',  ds:'快艇 赔率 ×1.6',                 mod:{mul:{yz:1.6}}},
  {nm:'巅峰',  ds:'和值≥27 赔率 ×1.8',              mod:{mul:{s27:1.8}}},
  {nm:'低谷',  ds:'和值≤12 赔率 ×1.8',              mod:{mul:{s12:1.8}}},
  {nm:'万象',  ds:'全不同 赔率 ×2',                 mod:{mul:{ad:2}}},
  {nm:'阴阳',  ds:'全奇偶 赔率 ×1.8',               mod:{mul:{pa:1.8}}},
  {nm:'孤注',  ds:'本关全部赔率 ×1.9',              mod:{mulAll:1.9}},
  {nm:'禁地',  ds:'小顺不可押，全部赔率 ×1.25',     mod:{mulAll:1.25, ban:['ss']}, risk:1},
  {nm:'寒风',  ds:'本关仅 2 次投掷，赔率按高压档',   mod:{rolls:2}, risk:1},
  {nm:'保险',  ds:'弃注返还 25% → 40%',             mod:{foldRate:.40}},
  {nm:'重税',  ds:'最低下注 = 筹码 10%，赔率 ×1.35', mod:{mulAll:1.35, minBetPct:.10}, risk:1},
  {nm:'孤岛',  ds:'未命中退本金，全部赔率 ×0.6',     mod:{mulAll:.6, refund:true}, risk:1},
  {nm:'连庄',  ds:'本关赢下，下关赔率 +20%',        mod:{carry:.20}, risk:1}
];

var MAX_LV = 10;
var CHIP_FRACS = [0.05, 0.10, 0.20];
var TIERS = [{nm:'传奇',min:2200},{nm:'金',min:1700},{nm:'银',min:1400},{nm:'铜',min:1050}];
var S = null, audio = {};

/* ================= 工具 ================= */
function $(id){return document.getElementById(id);}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function d6(){return 1+Math.floor(Math.random()*6);}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function sfx(nm){
  try{
    if(!ASSETS.sfx[nm]) return;
    if(!audio[nm]) audio[nm] = new Audio(ASSETS.sfx[nm]);
    var a = audio[nm].cloneNode();
    a.volume = nm.indexOf('die')===0 ? .32 : .26;
    a.play().catch(function(){});
  }catch(e){}
}

/* ================= 规则 ================= */
function mod(){ return (S.card && S.card.mod) || {}; }
function rollsMax(){ return mod().rolls || 3; }
function twoRoll(){ return rollsMax() === 2; }
function isBanned(slot){ return (mod().ban || []).indexOf(slot) >= 0; }

function baseOdds(slot){ return twoRoll() ? O2[slot] : O3[slot]; }
function baseProb(slot){ return twoRoll() ? P2[slot] : P3[slot]; }

function oddsOf(slot){
  var o = baseOdds(slot), m = mod();
  if(m.mul && m.mul[slot]) o *= m.mul[slot];
  if(m.add && m.add[slot]) o += m.add[slot];
  if(m.mulAll) o *= m.mulAll;
  return o * (1 + S.carry);
}
function foldRate(){ return mod().foldRate || .25; }

function handKey(d){ return d.slice().sort(function(a,b){return a-b;}).join(''); }

/* 再掷 n 次仍命中的概率（预计算表，n=1..2） */
function pNext(slot, n){
  if(!S.dice[0]) return baseProb(slot);
  var row = CONT[handKey(S.dice)];
  if(!row) return 0;
  return row[String(clamp(n,1,2))][SLOTS.indexOf(slot)] / 1000;
}

/* ================= 牌型判定 ================= */
function satisfies(slot){
  var d = S.dice, c = {}, sum = 0, faces = {};
  for(var i=0;i<5;i++){ c[d[i]] = (c[d[i]]||0)+1; sum += d[i]; faces[d[i]] = 1; }
  var v = Object.keys(c).map(function(k){return c[k];}).sort(function(a,b){return b-a;});
  var nf = Object.keys(faces).length;
  function hasSet(sets){
    for(var i=0;i<sets.length;i++) if(sets[i].every(function(x){return faces[x];})) return true;
    return false;
  }
  switch(slot){
    case 'ss':  return hasSet([[1,2,3,4],[2,3,4,5],[3,4,5,6]]);
    case 'tp':  return v[0]===2 && v.length>1 && v[1]===2 && !faces[1];
    case 'fh':  return v[0]===3 && v.length>1 && v[1]===2;
    case 'fo':  return v[0]>=4;
    case 'ls':  return hasSet([[1,2,3,4,5],[2,3,4,5,6]]);
    case 'yz':  return v[0]===5;
    case 's27': return sum>=27;
    case 's12': return sum<=12;
    case 'ad':  return nf===5;
    case 'pa':  return Object.keys(faces).every(function(k){return (+k)%2===0;})
                 || Object.keys(faces).every(function(k){return (+k)%2===1;});
  }
  return false;
}

/* ================= 下注额度 ================= */
function minBet(){ return Math.max(10, Math.ceil(S.chips * (mod().minBetPct || .05))); }
function maxBet(){ return Math.floor(S.chips * .40); }
function chipAmount(){ return Math.max(10, Math.floor(S.chips * S.chipFrac)); }
function hasBet(){ return !!S.pick; }

/* ================= 渲染 ================= */
function renderAll(){
  $('lv').textContent = S.lv;
  var b = $('bank'), t = fmt(S.chips);
  if(b.textContent !== t){
    b.textContent = t;
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
  }
  renderPips(); renderCard(); renderDice(); renderSlots(); renderControls();
}

function renderPips(){
  var box = $('pips');
  if(box.children.length !== MAX_LV){
    box.innerHTML = '';
    for(var i=0;i<MAX_LV;i++) box.appendChild(document.createElement('i'));
  }
  for(var k=0;k<MAX_LV;k++){
    box.children[k].className = (k+1 < S.lv) ? 'done' : (k+1 === S.lv ? 'now' : '');
  }
}

function renderCard(){
  var c = S.card;
  $('cardName').textContent = c.nm;
  $('cardDesc').textContent = c.ds;
  var tag = $('cardTag');
  tag.textContent = c.risk ? '风险' : '任务';
  tag.style.background = c.risk ? '#c0392b' : '#d8a13a';
  tag.style.color = c.risk ? '#fff' : '#231a06';
  $('cardImg').src = ASSETS.cards[String((S.lv-1)%5+1)];
}

function renderDice(){
  var box = $('dice');
  box.innerHTML = '';
  for(var i=0;i<5;i++){
    var d = document.createElement('div');
    if(S.dice[i]){
      d.className = 'die';
      var locked = S.locked[i];
      var img = document.createElement('img');
      img.src = locked ? ASSETS.diceR[String(S.dice[i])] : ASSETS.dice[String(S.dice[i])];
      d.appendChild(img);
      if(locked) d.classList.add('locked');
      if(S.phase === 'rolled' && !locked && rollsMax() - S.rollsUsed > 0 && !satisfies(S.pick)){
        d.onclick = (function(idx){ return function(){ toggleLock(idx); }; })(i);
      }
    }else{
      d.className = 'die empty';
    }
    box.appendChild(d);
  }
}

function renderSlots(){
  var box = $('slots');
  box.innerHTML = '';
  var maxP = 0;
  SLOTS.forEach(function(s){ if(!isBanned(s)) maxP = Math.max(maxP, baseProb(s)); });

  SLOTS.forEach(function(s){
    var el = document.createElement('div');
    el.className = 'slot';
    var banned = isBanned(s);
    var picked = S.pick === s;
    var p = 0, l1 = '', l2 = '', bar = true;

    if(banned) el.classList.add('banned');
    if(picked) el.classList.add('on');

    if(S.phase === 'settle' && S.result){
      bar = false;
      if(picked){
        el.classList.add(S.result.hit ? 'win' : 'lose');
        l1 = S.result.hit ? ('赢 +' + fmt(S.result.pay)) : '未命中';
        l2 = '注' + fmt(S.betAmt);
      }else{
        l1 = banned ? '本关禁用' : '未选中';
        l2 = '';
      }
    }else if(S.phase === 'rolled' && picked){
      var formed = satisfies(s);
      var left = rollsMax() - S.rollsUsed;
      if(formed) el.classList.add('formed');
      p = formed ? 1 : pNext(s, left);
      l1 = formed ? '已成型' : ('命中 ' + (p*100).toFixed(1) + '%');
      l2 = '注' + fmt(S.betAmt) + ' · 赢' + fmt(S.betAmt * oddsOf(s));
    }else{
      p = baseProb(s);
      l1 = banned ? '本关禁用' : ('命中 ' + (p*100).toFixed(1) + '%');
      l2 = picked
        ? ('注' + fmt(S.betAmt) + ' · 赢' + fmt(S.betAmt * oddsOf(s)))
        : INFO[s].sub;
    }

    el.innerHTML =
      '<div class="nm">' + INFO[s].name + '</div>' +
      '<div class="odds">' + oddsOf(s).toFixed(2) + '×</div>' +
      '<div class="meta">' + l1 + '</div>' +
      '<div class="stake' + (picked?'':' dim') + '">' + l2 + '</div>' +
      (bar && !banned ? '<div class="bar" style="width:' + (p/maxP*100).toFixed(0) + '%"></div>' : '');

    if(S.phase === 'bet' && !banned) el.onclick = function(){ pickSlot(s); };
    box.appendChild(el);
  });

  $('betTotal').textContent = S.pick ? ('· ' + INFO[S.pick].name + ' ' + fmt(S.betAmt)) : '';
}

function renderControls(){
  var main = $('btnMain'), fold = $('btnFold');
  fold.style.display = 'none';
  main.classList.remove('green');

  if(S.phase === 'bet'){
    main.textContent = '掷 骰';
    var msg = '', ok = true;
    if(!S.pick){ ok = false; msg = '先选一个注位'; }
    else if(S.betAmt < minBet()){ ok = false; msg = '最低下注 ' + fmt(minBet()) + ' 筹码'; }
    else if(S.betAmt > maxBet()){ ok = false; msg = '单关上限 ' + fmt(maxBet()) + '（筹码 40%）'; }
    else msg = '掷骰后可点骰子锁定，再重掷';
    main.disabled = !ok;
    setHint(msg);
    return;
  }

  if(S.phase === 'rolled'){
    var left = rollsMax() - S.rollsUsed;
    var nLock = S.locked.filter(Boolean).length;
    var formed = satisfies(S.pick);
    main.disabled = false;

    if(formed){
      main.textContent = '结 算';
      main.classList.add('green');
      setHint('已成型 · 点结算领取 +' + fmt(Math.floor(S.betAmt * oddsOf(S.pick))));
    }else{
      var canRoll = left > 0 && nLock < 5;
      main.textContent = canRoll ? ('重 掷 (' + left + ')') : '结 算';
      if(canRoll){
        setHint(left > 0 ? ('命中 ' + (pNext(S.pick,left)*100).toFixed(1) + '% · 已锁 ' + nLock + ' 颗') : '');
      }else if(nLock === 5){
        setHint('5 颗全锁 · 直接结算');
      }else{
        setHint('最后一次投掷');
      }
      if(left > 0 && !formed){
        fold.style.display = '';
        $('foldHint').textContent = '退' + fmt(Math.floor(S.betAmt * foldRate()));
      }
    }
    return;
  }

  main.textContent = '下一关';
  main.disabled = false;
  setHint('点「下一关」继续');
}

function setHint(t){ $('hint').textContent = t; }

/* ================= 下注 ================= */
function renderChipSel(){
  var box = $('chipsel');
  box.innerHTML = '';
  CHIP_FRACS.forEach(function(f){
    var b = document.createElement('button');
    b.textContent = fmt(Math.max(10, Math.floor(S.chips * f)));
    if(Math.abs(S.chipFrac - f) < 1e-9) b.className = 'on';
    b.onclick = function(){
      S.chipFrac = f;
      if(S.pick) S.betAmt = clamp(chipAmount(), minBet(), maxBet());
      renderAll(); renderChipSel();
    };
    box.appendChild(b);
  });
  var c = document.createElement('button');
  c.textContent = '撤注';
  c.onclick = function(){ S.pick = null; S.betAmt = 0; renderAll(); renderChipSel(); };
  box.appendChild(c);
}

function pickSlot(slot){
  if(S.phase !== 'bet' || isBanned(slot)) return;
  if(S.pick === slot){ S.pick = null; S.betAmt = 0; }
  else {
    S.pick = slot;
    S.betAmt = clamp(chipAmount(), minBet(), maxBet());
    sfx('chipsCollide1');
  }
  renderAll(); renderChipSel();
}

/* ================= 投掷 ================= */
function rollDice(idx){
  S.dice = S.dice.slice();
  idx.forEach(function(i){ S.dice[i] = d6(); });
}

function startRoll(){
  S.chips -= S.betAmt;
  S.phase = 'rolled';
  S.rollsUsed = 0;
  S.locked = [false,false,false,false,false];
  S.result = null;
  rollDice([0,1,2,3,4]);
  S.rollsUsed = 1;
  sfx('dieThrow1');
  renderAll();
  if(rollsMax() - S.rollsUsed <= 0){
    setTimeout(function(){ if(S.phase === 'rolled') settle(); }, 420);
  }
}

function doMain(){
  if(S.phase === 'bet'){ startRoll(); return; }
  if(S.phase === 'rolled'){
    var left = rollsMax() - S.rollsUsed;
    if(left <= 0 || S.locked.every(Boolean) || satisfies(S.pick)){ settle(); return; }
    rerollOnce();
    return;
  }
  if(S.phase === 'settle') nextLevel();
}

function rerollOnce(){
  var toRoll = [];
  for(var i=0;i<5;i++) if(!S.locked[i]) toRoll.push(i);
  if(toRoll.length === 0) return;
  rollDice(toRoll);
  S.rollsUsed++;
  sfx('dieThrow2');
  renderAll();
  if(rollsMax() - S.rollsUsed <= 0){
    setTimeout(function(){ if(S.phase === 'rolled') settle(); }, 420);
  }
}

function toggleLock(i){
  if(S.phase !== 'rolled') return;
  if(rollsMax() - S.rollsUsed <= 0) return;
  S.locked[i] = !S.locked[i];
  sfx('cardSlide1');
  renderAll();
}

/* ================= 弃注 ================= */
function doFold(){
  if(S.phase !== 'rolled') return;
  if(satisfies(S.pick)) return;
  var refund = Math.floor(S.betAmt * foldRate());
  S.chips += refund;
  S.result = {hit:false, pay:0, folded:true};
  S.phase = 'settle';
  sfx('cardPlace2');
  toast('−' + fmt(S.betAmt - refund), '弃注 · 退回 ' + fmt(refund));
  renderAll();
  setTimeout(afterSettle, 480);
}

/* ================= 结算 ================= */
function settle(){
  if(S.phase !== 'rolled') return;
  var hit = satisfies(S.pick);
  var pay = 0;

  if(hit){
    pay = Math.floor(S.betAmt * oddsOf(S.pick));
    S.chips += pay;
    sfx('chipsCollide1');
  }else{
    if(mod().refund){ pay = S.betAmt; S.chips += pay; }
    sfx('cardPlace2');
  }

  S.result = {hit:hit, pay:pay};
  var net = pay - S.betAmt;
  S.lastDelta = net;

  if(net > 0) toast('+' + fmt(net), INFO[S.pick].name + ' 命中 +' + fmt(pay));
  else if(net === 0) toast('±0', '退本 ' + fmt(pay));
  else toast('−' + fmt(-net), hit ? '命中但未覆盖本注' : '本关未命中');

  S.phase = 'settle';
  renderAll();
  setTimeout(afterSettle, 480);
}

function afterSettle(){
  if(S.lv >= MAX_LV){ finish(); return; }
  setHint('点「下一关」继续');
}

/* ================= 关卡流 ================= */
function dealCard(){
  if(!S.deck || S.deck.length === 0){
    S.deck = shuffle(CARDS.map(function(_,i){ return i; }));
  }
  S.card = CARDS[S.deck.pop()];
}

function startLevel(){
  dealCard();
  S.phase = 'bet';
  S.pick = null;
  S.betAmt = 0;
  S.result = null;
  S.dice = [0,0,0,0,0];
  S.locked = [false,false,false,false,false];
  S.rollsUsed = 0;
  S.chipFrac = 0.10;
  renderAll();
  renderChipSel();
}

function nextLevel(){
  if(S.lv >= MAX_LV){ finish(); return; }
  if(mod().carry && S.lastDelta > 0) S.carry += mod().carry;
  else S.carry = 0;

  S.lv++;
  if(S.chips < 10){
    S.chips = 1000;
    toast('破 产', '筹码补足至 1000');
  }
  startLevel();
}

function tierOf(c){
  for(var i=0;i<TIERS.length;i++) if(c >= TIERS[i].min) return TIERS[i].nm;
  return '散户';
}

function finish(){
  var tier = tierOf(S.chips);
  var order = {'散户':0,'铜':1,'银':2,'金':3,'传奇':4};
  var prev = localStorage.getItem('dice_tier') || '';
  var prevRank = order[prev] !== undefined ? order[prev] : -1;
  var rank = order[tier];
  // 散户不算成绩，不记也不报"新纪录"
  var isNew = rank > prevRank && rank > 0;
  if(isNew) localStorage.setItem('dice_tier', tier);

  $('ovTier').textContent = tier;
  var line2;
  if(isNew) line2 = '<b style="color:#ffd97a">新纪录！</b>';
  else if(rank > 0 && rank === prevRank) line2 = '平历史最佳：' + prev;
  else if(prev && prevRank > 0) line2 = '历史最佳：' + prev;
  else line2 = '最佳还需 ' + fmt(Math.max(0, 1050 - S.chips)) + ' 筹码到铜牌';
  $('ovBody').innerHTML =
    '最终筹码 <span class="num">' + fmt(S.chips) + '</span><br>' +
    line2 +
    '<br><span style="color:#6f9686">起始 1000 · 2200 达成传奇</span>';
  $('ov').classList.add('show');
}

function toast(big, sm){
  var el = $('toast');
  $('toastBig').textContent = big;
  $('toastBig').className = 'big' + (big.charAt(0) === '−' ? ' neg' : '');
  $('toastSm').textContent = sm || '';
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}

/* ================= 赔率表 ================= */
function buildOddsTable(){
  var t = $('oddsTable'), h = '<tr><th>注位</th><th>命中</th><th>赔率</th></tr>';
  SLOTS.forEach(function(s){
    h += '<tr><td>' + INFO[s].name + '</td><td>' + (P3[s]*100).toFixed(1) + '%</td><td>'
       + O3[s].toFixed(2) + '×</td></tr>';
  });
  t.innerHTML = h;
}

/* ================= 事件 ================= */
$('btnMain').onclick = doMain;
$('btnFold').onclick = doFold;
$('ovBtn').onclick = function(){ $('ov').classList.remove('show'); resetRun(); };
$('ovRulesBtn').onclick = function(){ $('ovRules').classList.remove('show'); };
$('helpBtn').onclick = function(){ $('ovRules').classList.add('show'); };

function resetRun(){
  S = {lv:1, chips:1000, carry:0, deck:[], pick:null, betAmt:0, chipFrac:.10,
       dice:[0,0,0,0,0], locked:[false,false,false,false,false],
       phase:'bet', rollsUsed:0, result:null,
       lastDelta:0, card:null};
  startLevel();
}

buildOddsTable();
resetRun();
$('ovRules').classList.add('show');
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9e4cd">
  <title>跃跃小蓝</title>
  <link rel="icon" type="image/png" href="assets/sprites.png">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="play-view" aria-label="跃跃小蓝游戏">
    <div id="stage" class="stage">
      <canvas id="game" width="384" height="216" aria-label="自动奔跑射击游戏，点击或按空格跳跃"></canvas>

      <div class="hud">
        <div class="hud-stats">
          <div class="stat"><span class="stat-label">金币</span><span id="coin-count">0 / 0</span></div>
          <div class="stat"><span class="stat-label">击破</span><span id="enemy-count">0 / 0</span></div>
          <div class="stat time-stat"><span class="stat-label">用时</span><span id="time-count">0:00.0</span></div>
        </div>
        <button id="pause-button" class="icon-button" title="暂停 (P)" aria-label="暂停">Ⅱ</button>
      </div>
      <div class="progress-track"><div id="level-progress"></div></div>
      <div class="top-tip" id="top-tip">空格 / 点击屏幕，跳起来！</div>

      <div id="screen-overlay" class="screen-overlay">
        <section id="result-panel" class="panel result-panel" hidden>
          <span id="result-eyebrow" class="eyebrow">再试一次</span>
          <h2 id="result-title">就差一点！</h2>
          <p id="result-description">留意前方的路，下一跳会更好。</p>
          <div id="result-stats" class="result-stats"></div>
          <button id="result-button" class="primary-button">重新出发 <span>↻</span></button>
        </section>
        <section id="pause-panel" class="panel pause-panel" hidden>
          <span class="eyebrow">喘口气</span>
          <h2>暂停一下</h2>
          <p>冒险会在这里等你。</p>
          <button id="resume-button" class="primary-button">继续冒险 <span>→</span></button>
          <button id="restart-button" class="text-button">重新开始本关</button>
        </section>
      </div>

      <div class="game-controls">
        <div class="control-hint"><span class="keycap">SPACE</span><span>跳跃</span><span class="hint-divider">/</span><span class="double-jump-icon">↟</span><span>踩到蘑菇后 · 空中可再跳一次</span></div>
        <button id="jump-button" class="jump-button"><span class="jump-arrow">↑</span><span>跳一下！</span></button>
        <button id="sound-button" class="sound-button" aria-label="关闭声音" title="开关声音"><span id="sound-icon">♪</span></button>
      </div>
    </div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="game.js?v=10"></script>
</body>
</html>
